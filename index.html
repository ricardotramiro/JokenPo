<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Winky+Rough:wght@400;700&display=swap"rel="stylesheet"/>
    <link rel="stylesheet" href="styles.css" />
    <title>JokenPô</title>
  </head>
  <body>
    <main class="container">
      <h1>JokenPô</h1>
      <div class="buttons">
        <button id="stone" class="play-btn" aria-label="Pedra">🪨</button>
        <button id="paper" class="play-btn" aria-label="Papel">📄</button>
        <button id="scissors" class="play-btn" aria-label="Tesoura">✂️</button>
      </div>
      <div class="status">
        <p id="choices">Escolha uma opção acima para jogar</p>
        <p class="result"></p>
      </div>
      <div class="scoreboard">
        <p class="your-score">Sua Pontuação: <span id="human-score">0</span></p>
        <p class="machine-score">
          Pontuação do Jogo: <span id="machine-score">0</span>
        </p>
      </div>
      <button id="reset" class="reset-btn">Reiniciar</button>
    </main>
    <script src="script.js"></script>
  </body>
</html>
